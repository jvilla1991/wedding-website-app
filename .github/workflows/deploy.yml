name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "24"  # Angular 21 requires Node 20.19+ / 22 / 24

jobs:
  build-and-deploy:
    name: Build, upload & invalidate
    runs-on: ubuntu-latest
    # Runs in the "production" GitHub Environment so the OIDC token subject is
    # repo:<org>/<repo>:environment:production — matching the deploy role's trust.
    environment: production

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Build ─────────────────────────────────────────────────────────────────

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Inject the real RSVP API settings into the committed environment.prod.ts.
      # API_URL is the event-rsvp-api base URL; EVENT_ID is the wedding's event id.
      #
      # IMPORTANT: only fill the two placeholder fields — do NOT rewrite the whole
      # file. The committed environment.prod.ts also carries siteMode and typing
      # that must be preserved; overwriting the file wholesale would break the
      # sed patterns and silently ship a dead RSVP form.
      - name: Inject production API settings
        env:
          API_URL: ${{ secrets.API_URL }}
          EVENT_ID: ${{ secrets.EVENT_ID }}
        run: |
          sed -i "s|apiUrl: ''|apiUrl: '${API_URL}'|" src/environments/environment.prod.ts
          sed -i "s|eventId: 0|eventId: ${EVENT_ID}|" src/environments/environment.prod.ts
          echo "Injected API settings:"
          cat src/environments/environment.prod.ts

      - name: Build
        run: npm run build -- --configuration production

      # ── AWS credentials via OIDC ──────────────────────────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Deploy to S3 ──────────────────────────────────────────────────────────
      # Angular uses outputHashing: "all" in production, so JS/CSS filenames
      # contain a content hash. Those can be cached indefinitely — only index.html
      # needs a short TTL so deploys are visible quickly.

      - name: Sync dist/ to S3
        run: |
          # Long-cache all hashed assets (Angular adds content hash to filenames)
          aws s3 sync dist/wedding-website/browser/ "s3://${{ secrets.S3_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --region "$AWS_REGION"

          # Short-cache index.html so new deploys are picked up immediately
          aws s3 cp dist/wedding-website/browser/index.html \
            "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --region "$AWS_REGION"

      # ── CloudFront invalidation ───────────────────────────────────────────────

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
