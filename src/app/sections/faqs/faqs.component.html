<!-- FAQ -->
<section class="band band--alt reveal" id="faqs" data-only="full">
  <div class="wrap">
    <span class="kicker">Good to Know</span>
    <h2 class="headline">FAQs</h2>
    <div class="rule"></div>
    <div class="faq">
      @for (faq of faqs; track faq.q; let i = $index) {
        <div class="faq-item" [class.open]="openIndex() === i">
          <button class="faq-q" type="button" (click)="toggle(i)">{{ faq.q }}</button>
          <div class="faq-a">{{ faq.a }}</div>
        </div>
      }
    </div>
  </div>
</section>
